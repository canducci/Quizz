<!doctype html>
<!--
  SHOWCASE copy of prototype/certificate-ui with only the chosen variant (published on GitHub Pages).
  Three variants of the Certificate PDF (fixed layout, A4 landscape), switchable via ?variant=A|B|C.
  The floating bar also switches sample data (long names, expiry, English vs pt-BR) and the Creator's accent colour.
  Print (Ctrl+P → Save as PDF) to see the real page: the bar is hidden in print.
  Open with: xdg-open prototypes/certificate-pdf.prototype.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quizz prototype: Certificate PDF</title>
<style>
  @page { size: A4 landscape; margin: 0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #d9dce1; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #111827; }
  .desk { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px 110px; }
  /* A4 landscape at 96dpi: 1123 x 794 px */
  .page { width: 1123px; height: 794px; background: #fff; position: relative; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.18); --accent: #7c3aed; }
  .logo { width: 64px; height: 64px; border-radius: 14px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 24px; letter-spacing: -.02em; flex: none; }
  .qr { width: 96px; height: 96px; background: repeating-conic-gradient(#111 0 25%, #fff 0 50%) 0 0/12px 12px; border: 8px solid #fff; outline: 1px solid #d1d5db; flex: none; }
  .scrawl { font: italic 34px/1 "Brush Script MT", "Segoe Script", cursive; color: #0f2a4a; }
  .mono { font-family: ui-monospace, monospace; }
  .fit { overflow-wrap: anywhere; }

  /* A: Classic frame (as drawn on the Verification Page) */
  .A { padding: 72px 84px; display: flex; flex-direction: column; }
  .A::before { content: ""; position: absolute; inset: 22px; border: 2px solid var(--accent); opacity: .55; }
  .A::after { content: ""; position: absolute; inset: 30px; border: 1px solid var(--accent); opacity: .25; }
  .A .brand { display: flex; align-items: center; gap: 16px; font-size: 20px; font-weight: 700; }
  .A .kicker { margin-top: 48px; text-transform: uppercase; letter-spacing: .24em; font-size: 14px; color: #6b7280; }
  .A .lead { color: #4b5563; font-size: 18px; margin-top: 10px; }
  .A .holder { font-size: 60px; font-weight: 700; letter-spacing: -.015em; line-height: 1.05; margin: 10px 0 14px; max-width: 900px; }
  .A .what { font-size: 20px; color: #374151; max-width: 760px; line-height: 1.5; }
  .A .bottom { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; }
  .A .sig { border-top: 1px solid #111827; padding-top: 6px; min-width: 260px; font-size: 14px; color: #374151; }
  .A .meta { text-align: right; font-size: 12px; color: #6b7280; line-height: 1.6; }

  /* B: Accent band on the left */
  .B { display: grid; grid-template-columns: 330px 1fr; }
  .B .band { background: var(--accent); color: #fff; padding: 56px 40px; display: flex; flex-direction: column; }
  .B .band .logo { background: #fff; color: var(--accent); }
  .B .band .org { font-size: 22px; font-weight: 700; margin-top: 18px; line-height: 1.2; }
  .B .band .score { margin-top: auto; } .B .band .score b { display: block; font-size: 84px; line-height: 1; font-weight: 800; }
  .B .band .score span { font-size: 15px; opacity: .85; }
  .B .band .qrwrap { margin-top: 28px; display: flex; gap: 12px; align-items: center; font-size: 12px; }
  .B .main { padding: 64px 64px 56px; display: flex; flex-direction: column; }
  .B .kicker { text-transform: uppercase; letter-spacing: .2em; font-size: 14px; color: #6b7280; }
  .B .holder { font-size: 56px; font-weight: 800; line-height: 1.05; letter-spacing: -.02em; margin: 26px 0 18px; }
  .B .rule { width: 72px; height: 5px; background: var(--accent); border-radius: 3px; margin-bottom: 22px; }
  .B .what { font-size: 21px; color: #374151; line-height: 1.5; }
  .B .facts { margin-top: auto; display: flex; gap: 40px; font-size: 13px; color: #6b7280; }
  .B .facts b { display: block; color: #111827; font-size: 16px; }
  .B .sig { margin-top: 30px; font-size: 14px; color: #374151; }

  /* C: Centered, formal */
  .C { padding: 64px 100px; text-align: center; display: flex; flex-direction: column; align-items: center; background:
       radial-gradient(circle at 50% 120%, color-mix(in srgb, var(--accent) 10%, transparent) 0 40%, transparent 41%), #fff; }
  .C .logo { margin: 0 auto; }
  .C .org { margin-top: 12px; font-size: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #374151; }
  .C h1 { font: 400 44px/1.1 Georgia, "Times New Roman", serif; margin: 34px 0 6px; letter-spacing: .02em; }
  .C .orn { width: 140px; height: 2px; background: var(--accent); margin: 14px auto 24px; }
  .C .lead { font-size: 17px; color: #4b5563; }
  .C .holder { font: 400 56px/1.1 Georgia, "Times New Roman", serif; margin: 12px 0 18px; max-width: 900px; border-bottom: 1px solid #d1d5db; padding: 0 30px 12px; }
  .C .what { font-size: 19px; color: #374151; max-width: 760px; line-height: 1.5; }
  .C .bottom { margin-top: auto; width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 24px; }
  .C .sig { border-top: 1px solid #111827; padding-top: 6px; font-size: 14px; color: #374151; }
  .C .meta { font-size: 12px; color: #6b7280; line-height: 1.6; }

  #switcher { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 1000; display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-radius: 999px; background: #111; color: #fff; font: 13px/1.2 ui-monospace, monospace; box-shadow: 0 6px 24px rgba(0,0,0,.35); white-space: nowrap; }
  #switcher button { background: #333; color: #fff; border: 0; border-radius: 999px; width: 28px; height: 28px; cursor: pointer; }
  #switcher select { font: inherit; background: #333; color: #fff; border: 0; border-radius: 6px; padding: 4px 6px; }
  #switcher input[type=color] { width: 28px; height: 28px; border: 0; padding: 0; background: none; cursor: pointer; }
  @media print { #switcher { display: none; } body { background: #fff; } .desk { padding: 0; display: block; } .page { box-shadow: none; } }
  @media screen and (max-width: 1180px) { .page { transform: scale(calc((100vw - 32px) / 1123px)); transform-origin: top center; } }
</style>
</head>
<body>
<div class="desk"><div id="page"></div></div>
<div id="switcher"></div>

<script>
// ======================= Fake data =======================
const SAMPLES = {
  pt: { label: 'pt-BR, normal', lang: 'pt', holder: 'Ana Souza', assessment: 'Fundamentos de React', score: 86, passing: 80, issued: new Date(2026, 2, 14), expires: null,
        creator: 'Acme Academia', initials: 'AA', signer: 'Marina Costa', signerTitle: 'Diretora de Ensino', id: '7K2P9Q' },
  en: { label: 'English, with Expiry', lang: 'en', holder: 'Jordan Lee', assessment: 'Kubernetes for Developers', score: 92, passing: 75, issued: new Date(2026, 5, 2), expires: new Date(2028, 5, 2),
        creator: 'CloudSkills', initials: 'CS', signer: 'Priya Natarajan', signerTitle: 'Head of Curriculum', id: 'Q4M8TZ' },
  long: { label: 'pt-BR, very long names', lang: 'pt', holder: 'Maria Eduarda dos Santos Albuquerque Figueiredo de Oliveira', assessment: 'Arquitetura de Microsserviços Orientada a Eventos com Kafka, Kubernetes e Observabilidade Distribuída', score: 71, passing: 70, issued: new Date(2026, 8, 20), expires: new Date(2027, 8, 20),
        creator: 'Instituto Brasileiro de Engenharia de Software Aplicada', initials: 'IB', signer: 'Dr. João Pedro Vasconcelos', signerTitle: 'Coordenador Acadêmico', id: 'Z9X2LK' },
};
// The Certificate is always in its Assessment Language.
const T = {
  pt: { kicker: 'Certificado de aprovação', lead: 'Certificamos que', title: 'Certificado', passed: (a, s) => `foi aprovado(a) na avaliação <b>${a}</b> com nota ${s}%.`,
        on: 'Emitido em', exp: 'Válido até', noexp: 'Sem data de validade', verify: 'Verifique em', score: 'Nota', passing: 'Nota mínima', id: 'Certificado', date: 'pt-BR' },
  en: { kicker: 'Certificate of achievement', lead: 'This certifies that', title: 'Certificate', passed: (a, s) => `has passed the <b>${a}</b> assessment with a score of ${s}%.`,
        on: 'Issued', exp: 'Valid until', noexp: 'Does not expire', verify: 'Verify at', score: 'Score', passing: 'Passing Score', id: 'Certificate', date: 'en-US' },
};
const S = { sample: 'pt', accent: '#7c3aed' };
const params = new URLSearchParams(location.search);
if (SAMPLES[params.get('sample')]) S.sample = params.get('sample');

const d = () => SAMPLES[S.sample], t = () => T[d().lang];
const date = x => x.toLocaleDateString(t().date, { day: 'numeric', month: 'long', year: 'numeric' });
const url = () => `quizz.app/c/${d().id}`;
// Shrink the holder's name to fit: long names are the layout's hardest case.
const nameSize = (base, len) => len > 40 ? Math.round(base * .62) : len > 26 ? Math.round(base * .8) : base;

// ======================= Variants =======================
function VariantA() {
  const c = d(), x = t();
  return `<div class="page A" style="--accent:${S.accent}">
    <div class="brand"><div class="logo">${c.initials}</div><span class="fit">${c.creator}</span></div>
    <div class="kicker">${x.kicker}</div><div class="lead">${x.lead}</div>
    <div class="holder fit" style="font-size:${nameSize(60, c.holder.length)}px">${c.holder}</div>
    <div class="what fit">${x.passed(c.assessment, c.score)}</div>
    <div class="bottom">
      <div class="sig"><div class="scrawl">${c.signer}</div>${c.signer} · ${c.signerTitle}</div>
      <div style="display:flex;gap:16px;align-items:flex-end"><div class="meta">${x.on} ${date(c.issued)}<br>${c.expires ? `${x.exp} ${date(c.expires)}` : x.noexp}<br>${x.verify} <span class="mono">${url()}</span></div><div class="qr"></div></div>
    </div></div>`;
}
function VariantB() {
  const c = d(), x = t();
  return `<div class="page B" style="--accent:${S.accent}">
    <div class="band"><div class="logo">${c.initials}</div><div class="org fit">${c.creator}</div>
      <div class="score"><b>${c.score}%</b><span>${x.score} · ${x.passing} ${c.passing}%</span></div>
      <div class="qrwrap"><div class="qr" style="outline:0"></div><div>${x.verify}<br><span class="mono">${url()}</span></div></div></div>
    <div class="main"><div class="kicker">${x.kicker}</div>
      <div class="holder fit" style="font-size:${nameSize(56, c.holder.length)}px">${c.holder}</div><div class="rule"></div>
      <div class="what fit">${x.passed(c.assessment, c.score)}</div>
      <div class="sig"><div class="scrawl">${c.signer}</div>${c.signer} · ${c.signerTitle}</div>
      <div class="facts"><div>${x.on}<b>${date(c.issued)}</b></div><div>${x.exp}<b>${c.expires ? date(c.expires) : '—'}</b></div><div>${x.id}<b class="mono">${c.id}</b></div></div></div></div>`;
}
function VariantC() {
  const c = d(), x = t();
  return `<div class="page C" style="--accent:${S.accent}">
    <div class="logo">${c.initials}</div><div class="org fit">${c.creator}</div>
    <h1>${x.title}</h1><div class="orn"></div>
    <div class="lead">${x.lead}</div>
    <div class="holder fit" style="font-size:${nameSize(56, c.holder.length)}px">${c.holder}</div>
    <div class="what fit">${x.passed(c.assessment, c.score)}</div>
    <div class="bottom">
      <div class="meta" style="text-align:left">${x.on} ${date(c.issued)}<br>${c.expires ? `${x.exp} ${date(c.expires)}` : x.noexp}<br>${x.id} <span class="mono">${c.id}</span></div>
      <div><div class="qr" style="margin:0 auto"></div><div class="meta mono" style="margin-top:4px">${url()}</div></div>
      <div class="sig"><div class="scrawl">${c.signer}</div>${c.signer} · ${c.signerTitle}</div></div></div>`;
}

// ======================= Switcher =======================
const VARIANTS = { A: ['Classic frame', VariantA], B: ['Accent band', VariantB], C: ['Centered formal', VariantC] };
let variant = 'C'; // showcase: chosen variant only
function render() {
  document.getElementById('page').innerHTML = VARIANTS[variant][1]();
  document.getElementById('switcher').innerHTML = `
    <select data-sample>${Object.entries(SAMPLES).map(([k, v]) => `<option value="${k}" ${k === S.sample ? 'selected' : ''}>${v.label}</option>`).join('')}</select>
    <input type="color" value="${S.accent}" data-accent title="Creator's accent colour">
    <span style="color:#9ca3af">A4 landscape · Ctrl+P to print</span>`;
  history.replaceState(null, '', '?' + new URLSearchParams({ variant, sample: S.sample }));
}
function cycle(n) { const k = Object.keys(VARIANTS); variant = k[(k.indexOf(variant) + n + k.length) % k.length]; render(); }
document.addEventListener('click', e => { const sw = e.target.closest('[data-sw]'); if (sw) cycle(+sw.dataset.sw); });
document.addEventListener('change', e => { if (e.target.matches('[data-sample]')) { S.sample = e.target.value; render(); } });
document.addEventListener('input', e => { if (e.target.matches('[data-accent]')) { S.accent = e.target.value; document.querySelector('.page').style.setProperty('--accent', S.accent); } });
document.addEventListener('keydown', e => { if (e.target.closest('input, select')) return;   });
render();
</script>
</body>
</html>
