# Manual only for now: no push or pull_request triggers until the owner turns them on.
name: CI

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: quizz
          POSTGRES_PASSWORD: quizz
          POSTGRES_DB: quizz
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm test
        env:
          DATABASE_URL: postgres://quizz:quizz@localhost:5432/quizz

  e2e:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Each database adds its compose file over compose.yml and compose.ci.yml.
        database: [sqlite, postgres]
        include:
          - database: sqlite
            compose: ""
          - database: postgres
            compose: -f compose.postgres.yml
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose -f compose.yml -f compose.ci.yml ${{ matrix.compose }} up -d --build --wait
      - run: npm run test:e2e
      - if: failure()
        run: docker compose logs
