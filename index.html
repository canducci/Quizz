<!doctype html>
<!--
  Quizz product showcase: the chosen design for each screen, one tab each.
  Wireframes with fake data and in-memory state; no backend. The dark bar at the bottom of each screen switches demo states.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quizz: product prototype</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; font: 15px/1.4 system-ui, sans-serif; color: #111827; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 20px; border-bottom: 1px solid #e5e7eb; flex-wrap: wrap; }
  header b { font-size: 18px; }
  header small { color: #6b7280; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav a { padding: 6px 12px; border-radius: 8px; color: #374151; text-decoration: none; }
  nav a:hover { background: #f3f4f6; }
  nav a.on { background: #111827; color: #fff; }
  .standalone { margin-left: auto; color: #6b7280; font-size: 13px; }
  iframe { flex: 1; width: 100%; border: 0; }
</style>
</head>
<body>
<header>
  <b>Quizz</b><small>Assessments that issue verifiable Certificates</small>
  <nav>
    <a href="#attempt" title="Learner">Take an Assessment</a>
    <a href="#editor" title="Creator">Assessment editor</a>
    <a href="#statistics" title="Creator">Statistics</a>
    <a href="#certificate" title="Learner">Certificate PDF</a>
    <a href="#verification" title="Public">Verification Page</a>
  </nav>
  <a class="standalone" target="_blank">Open standalone ↗</a>
</header>
<iframe title="Screen"></iframe>
<script>
const screens = [...document.querySelectorAll('nav a')].map(a => a.hash.slice(1));
function show() {
  const s = screens.includes(location.hash.slice(1)) ? location.hash.slice(1) : screens[0];
  document.querySelector('iframe').src = s + '.html';
  document.querySelector('.standalone').href = s + '.html';
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.hash === '#' + s));
}
addEventListener('hashchange', show);
show();
</script>
</body>
</html>
